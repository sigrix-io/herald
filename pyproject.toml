[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "herald-post"
version = "0.1.0"
description = "Post one announcement to every channel you choose, after showing exactly what each one will get."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Sigrix" }]
keywords = ["announcements", "release notes", "changelog", "social media", "bluesky", "mastodon", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications",
]
# Standard library only. A dependency here is a rule broken, and tests/test_rules.py says so.
dependencies = []

[project.urls]
Homepage = "https://github.com/sigrix-io/herald"
Source = "https://github.com/sigrix-io/herald"
Issues = "https://github.com/sigrix-io/herald/issues"
Changelog = "https://github.com/sigrix-io/herald/blob/main/CHANGELOG.md"

[project.scripts]
herald = "herald.cli:main"

# Every channel, the built-in ones included, is found through this group, so a channel
# another package registers here is as much a part of Herald as these.
[project.entry-points."herald.channels"]
stdout = "herald.channels.stdout:StdoutChannel"

[project.optional-dependencies]
# regex is the tests' oracle for Unicode's grapheme clusters; herald itself never imports it.
dev = ["pytest>=8", "regex>=2024.11.6", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/herald"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "RUF"]
ignore = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
