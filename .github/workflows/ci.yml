name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The merge queue tests each pull request merged onto main before main moves, and waits
  # for ci-passed on that run; without this trigger the check never arrives.
  merge_group:

permissions:
  contents: read

concurrency:
  # A merge group carries no pull request number. Keyed by the number alone, every queue
  # entry would share one key, and each would cancel the one ahead of it.
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python: "3.14"
          - os: macos-latest
            python: "3.14"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest

  # The action, as a repository uses it: three runs on fresh runners, which share the ledger
  # only through the Actions cache. The first records the feed's one release and posts
  # nothing, the next posts the release the feed gains, and the last posts nothing.
  action-records:
    name: The action records a feed
    runs-on: ubuntu-latest
    env:
      LEDGER_NAME: ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: A feed with one release
        run: cp tests/feeds/releases-one.atom "$RUNNER_TEMP/releases.atom"
      - name: Watch it
        uses: ./
        with:
          feed: ${{ runner.temp }}/releases.atom
          to: stdout
          ledger: ${{ env.LEDGER_NAME }}
      - name: It posted nothing
        run: herald status --ledger-dir "$RUNNER_TEMP/herald-ledger-$LEDGER_NAME" --json | jq -e 'length == 0'
      - name: A live releases feed still has the shape the tests give theirs
        run: |
          python - <<'EOF'
          from herald.feeds import read_feed

          feed = read_feed("https://github.com/actions/checkout/releases.atom")
          assert feed.title == "Release notes from checkout", feed.title
          assert feed.items, "the feed held no releases"
          for item in feed.items:
              assert item.id.startswith("tag:github.com,2008:Repository/"), item.id
              assert item.link.startswith("https://github.com/actions/checkout/releases/tag/"), item.link
              assert item.title, item
          print(f"Read {len(feed.items)} releases, each with an id, a title and a link like the tests'.")
          EOF

  action-posts:
    name: The action posts what the feed gains
    needs: action-records
    runs-on: ubuntu-latest
    env:
      LEDGER_NAME: ci-${{ github.run_id }}-${{ github.run_attempt }}
    outputs:
      ledger: ${{ steps.posted.outputs.ledger }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The feed gains a release
        run: cp tests/feeds/releases-two.atom "$RUNNER_TEMP/releases.atom"
      - name: Watch it
        uses: ./
        with:
          feed: ${{ runner.temp }}/releases.atom
          to: stdout
          ledger: ${{ env.LEDGER_NAME }}
      - name: It posted the new release, and nothing else
        id: posted
        run: |
          ledger="$RUNNER_TEMP/herald-ledger-$LEDGER_NAME"
          herald status --ledger-dir "$ledger" --json | jq -e '
            length == 1 and .[0].state == "posted" and .[0].channel == "stdout"
            and .[0].announcement_id == "tag:github.com,2008:Repository/123456789/v1.2.0"'
          echo "ledger=$(sha256sum "$ledger/ledger.jsonl" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

  action-again:
    name: The action posts nothing twice
    needs: action-posts
    runs-on: ubuntu-latest
    env:
      LEDGER_NAME: ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The same feed
        run: cp tests/feeds/releases-two.atom "$RUNNER_TEMP/releases.atom"
      - name: Watch it
        uses: ./
        with:
          feed: ${{ runner.temp }}/releases.atom
          to: stdout
          ledger: ${{ env.LEDGER_NAME }}
      - name: It posted nothing, so the ledger is as the last run left it
        env:
          BEFORE: ${{ needs.action-posts.outputs.ledger }}
        run: test "$(sha256sum "$RUNNER_TEMP/herald-ledger-$LEDGER_NAME/ledger.jsonl" | cut -d ' ' -f 1)" = "$BEFORE"

  # The one check main requires. It always reports, and passes only when every job above
  # succeeded: a failed, cancelled or skipped job fails it, so a required check can never
  # wait on a job that did not run.
  ci-passed:
    name: ci-passed
    if: always()
    needs: [test, action-records, action-posts, action-again]
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::A job this check needs ended '$result'."
              exit 1
            fi
          done
